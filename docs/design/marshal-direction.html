<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marshal: taxi lines</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --asphalt:#17191C;    /* the apron: one surface, no cards */
  --raised:#212428;     /* only what needs you is raised */
  --ink:#F3F1EA;
  --muted:#8F9296;
  --faint:#3B3F45;
  --taxi:#F6CB3C;       /* painted centreline */
  --stop:#FF4A3A;       /* stop bar lights */
  --go:#55E0A2;
  --ease:cubic-bezier(.22,.8,.2,1);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Geist,system-ui,sans-serif;color:var(--ink);overflow:hidden;
  background:radial-gradient(70% 60% at 25% 35%,#b8a77c 0,#0000 70%),linear-gradient(#4a4132,#231d16);
  display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr);gap:14px;padding:16px}
.note{display:flex;gap:8px;align-items:center;font-size:13px;color:#efe8da}
.note p{margin-right:auto}
.note button{font:inherit;color:inherit;background:#0005;border:0;border-radius:6px;padding:6px 12px;cursor:pointer}
.note button[aria-pressed=true]{background:#efe8da;color:#231d16}
.stage{display:flex;align-items:center;justify-content:center;min-height:0;min-width:0;position:relative}

.win{width:1180px;height:690px;flex:none;background:var(--asphalt);border-radius:30px;padding:34px 40px 30px;
  display:grid;grid-template-rows:auto minmax(0,1fr);gap:18px;transform:scale(var(--s,1));
  box-shadow:0 50px 90px -20px #000c}

/* header: the one sentence that matters */
.head{display:grid;grid-template-columns:1fr auto;align-items:start;gap:24px;min-height:92px}
.tools{margin-top:-9px}
.mark{font-size:15px;font-weight:500;color:var(--muted);letter-spacing:.01em;margin-bottom:8px}
.say{font-size:44px;font-weight:600;letter-spacing:-.03em;line-height:1.04;max-width:20ch;text-wrap:balance}
.say em{font-style:normal}
.tools{display:flex;gap:4px;padding-top:2px}
.tool{font:inherit;font-size:15px;color:var(--muted);background:none;border:0;padding:9px 12px;border-radius:8px;cursor:pointer}
.tool:hover{color:var(--ink);background:#ffffff0d}

/* rows: an agent is a taxi line, not a card */
.rows{display:grid;grid-template-rows:repeat(4,minmax(0,1fr));gap:6px;min-height:0;transition:grid-template-rows .65s var(--ease)}
.row{display:grid;grid-template-columns:350px minmax(0,1fr) 104px;align-items:center;column-gap:34px;padding:0 20px;margin:0 -20px;
  border-radius:16px;min-height:0;cursor:pointer;position:relative;transition:background .3s}
.row:hover{background:#ffffff08}
.id{min-width:0}
.id h2{font-size:25px;font-weight:600;letter-spacing:-.02em;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance}
.id p{font-size:16px;color:var(--muted);margin-top:5px;display:flex;align-items:center;gap:9px}
.id p i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.stat{font-size:16px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}

/* the line */
.track{position:relative;height:74px}
.track .paint{position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;border-radius:2px}
.track .seg{position:absolute;top:50%;height:3px;margin-top:-1.5px;background:linear-gradient(90deg,var(--faint) 56%,#0000 56%) 0 0/calc(100%/var(--n)) 100%}
.track .paint b{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--taxi);width:var(--at);transition:width 1s var(--ease)}
.track .tick{position:absolute;top:50%;width:3px;height:13px;margin:-6.5px 0 0 -1.5px;border-radius:2px;background:var(--faint)}
.track .tick.done{background:var(--taxi)}
.track .craft{position:absolute;top:50%;left:var(--at);width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--ink);
  box-shadow:0 0 0 5px var(--asphalt);transition:left 1s var(--ease)}
.row.busy .craft::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.5px solid var(--ink);opacity:0;animation:ping 2.6s var(--ease) infinite}
@keyframes ping{0%{transform:scale(.6);opacity:.7}70%,100%{transform:scale(1.7);opacity:0}}
.track .now{position:absolute;bottom:calc(50% + 17px);left:var(--at);font-size:16px;white-space:nowrap;color:var(--ink);transform:translateX(-9px)}
.track .now.r{transform:translateX(calc(-100% + 9px))}
.track .now.after{transform:translateX(62px)}
.row.landed .craft{background:var(--go)}
.row.landed .paint b{background:var(--go)}
.row.landed .tick.done{background:var(--go)}
.row.landed .now{color:var(--muted)}

/* the stop bar: red lights across the line */
.sbar{position:absolute;left:calc(var(--at) + 34px);top:-12px;bottom:-12px;display:grid;gap:5px;align-content:center}
.sbar i{width:15px;height:10px;border-radius:3px;background:var(--stop);box-shadow:0 0 10px #ff4a3a99}
.row.needs{background:var(--raised)}
.row.needs .stat{color:var(--stop);font-weight:500}
.row.needs .sbar i{animation:steady 2.2s ease-in-out infinite}
@keyframes steady{50%{opacity:.5}}

/* open: the chosen line widens, the others thin out */
.win.open .rows{grid-template-rows:var(--open)}
.win.open .row:not(.sel) .id h2{font-size:19px;font-weight:500;color:var(--muted)}
.win.open .row:not(.sel) .id p,.win.open .row:not(.sel) .now,.win.open .row:not(.sel) .sbar{display:none}
.win.open .row:not(.sel) .track{height:30px}
.win.open .row.sel{cursor:default;display:block;padding:24px 28px 22px}
.win.open .row.sel>.id,.win.open .row.sel>.track,.win.open .row.sel>.stat{display:none}
.req{display:none;grid-template-columns:minmax(0,1fr) 250px;grid-template-rows:auto minmax(0,1fr) auto;column-gap:44px;row-gap:22px}
.win.open .row.sel .req{display:grid;animation:in .5s .12s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.cmd{font-family:"Geist Mono",ui-monospace,monospace;font-size:19px;color:var(--ink);padding:15px 18px;border-radius:10px;background:#0E0F11;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.facts{display:flex;gap:40px;align-items:end;font-size:15px;color:var(--muted);align-self:start}
.facts b{display:block;font-size:30px;font-weight:600;letter-spacing:-.02em;color:var(--ink);line-height:1.1;font-variant-numeric:tabular-nums}
.facts .gone b{color:var(--stop)}
.plan{grid-row:1/3;grid-column:2;list-style:none;padding:0;display:grid;gap:11px;align-content:start;font-size:16px;color:var(--muted)}
.plan li{display:grid;grid-template-columns:14px 1fr;gap:12px;align-items:center}
.plan li::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--faint);justify-self:center}
.plan li.done::before{background:var(--taxi)}
.plan li.held{color:var(--ink)}
.plan li.held::before{width:13px;height:9px;border-radius:3px;background:var(--stop)}
.clear{grid-column:1/3;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:28px;align-items:center}
.hold{display:grid;gap:11px;cursor:grab;user-select:none;touch-action:none;padding:6px 0}
.hold:active{cursor:grabbing}
.big{display:flex;gap:6px}
.big i{flex:1;height:15px;border-radius:4px;background:var(--stop);box-shadow:0 0 12px #ff4a3a80;transition:background .22s,box-shadow .22s,opacity .22s}
.big i.out{background:var(--faint);box-shadow:none}
.big.ok i{background:var(--go);box-shadow:0 0 12px #55e0a280}
.hold p{font-size:16px;color:var(--muted)}
.hold p b{color:var(--ink);font-weight:500}
.acts{display:flex;gap:8px}
.btn{font:inherit;font-size:17px;font-weight:500;height:50px;padding:0 24px;border-radius:12px;border:0;cursor:pointer;background:#ffffff12;color:var(--ink)}
.btn:hover{background:#ffffff1f}.btn:active{transform:translateY(1px)}
.btn.prim{background:var(--ink);color:var(--asphalt)}.btn.prim:hover{background:#fff}
.tools{align-items:center}
.row.stopped .now{color:var(--muted)}.row.stopped .stat{color:var(--stop);font-weight:500}
.win.open .row.sel{background:var(--raised)}
.log{list-style:none;padding:0;display:grid;gap:11px;align-content:start;font-size:17px;color:var(--muted);grid-row:1/3}
.log li{display:grid;grid-template-columns:62px 1fr}
.log code{font-family:"Geist Mono",ui-monospace,monospace;font-size:16px;color:var(--muted)}
.log li:last-child,.log li:last-child code{color:var(--ink)}
.plan li.now{color:var(--ink)}.plan li.now::before{width:10px;height:10px;border-radius:50%;background:var(--ink)}
.reply{height:50px;border-radius:12px;background:#0E0F11;display:flex;align-items:center;padding:0 18px;color:var(--muted);font-size:17px}
/* rail */
.rail{display:none;background:var(--asphalt);border-radius:22px;padding:18px 0;width:68px;gap:22px;justify-items:center;box-shadow:0 30px 50px -14px #000b}
body.is-rail .win{display:none} body.is-rail .rail{display:grid}
.rail i{width:16px;height:16px;border-radius:50%;background:var(--ink);position:relative}
.rail i.g{background:var(--go)}
.rail i.s{width:auto;height:auto;background:none;display:grid;gap:4px}
.rail i.s b{width:22px;height:7px;border-radius:3px;background:var(--stop);box-shadow:0 0 8px #ff4a3a99}
/* code found */
.found{display:none}
body.is-found .tip,body.is-found .vf s{display:none} body.is-found .found{display:grid}
body.is-found .vf{width:120px;background:conic-gradient(#fff 25%,#111 0 50%,#fff 0 75%,#111 0) 0 0/24px 24px;outline:10px solid #fff;outline-offset:-2px}
body.is-found .vf u{margin:-16px;border-color:var(--taxi)}
.found{margin-top:36px;background:var(--asphalt);border-radius:18px;padding:22px 24px;grid-template-columns:1fr auto;column-gap:34px;align-items:center;box-shadow:0 20px 40px -10px #000b}
.found h3{font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.found p{font-size:15px;color:var(--muted);margin-top:5px}
.btn.deny{background:none;box-shadow:inset 0 0 0 1.5px #ff4a3a88;color:#ff9c92}
.btn.deny:hover{background:#ff4a3a1c}

/* pairing */
.scan{position:absolute;inset:0;display:none;place-items:center}
body.pair .win{display:none} body.pair .scan{display:grid}
.vf{width:230px;aspect-ratio:1;position:relative;margin:0 auto}
.vf u{position:absolute;width:40px;height:40px;border:3px solid var(--ink);filter:drop-shadow(0 1px 2px #0009)}
.vf u:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-top-left-radius:10px}
.vf u:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-top-right-radius:10px}
.vf u:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-bottom-left-radius:10px}
.vf u:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-bottom-right-radius:10px}
.vf s{position:absolute;left:10px;right:10px;height:2px;background:var(--taxi);animation:sweep 2.6s var(--ease) infinite alternate}
@keyframes sweep{from{top:10%}to{top:90%}}
.tip{margin-top:24px;background:var(--asphalt);border-radius:14px;padding:16px 22px;font-size:19px;font-weight:500;display:flex;gap:22px;align-items:baseline;box-shadow:0 20px 40px -10px #000b}
.tip button{font:inherit;font-size:15px;font-weight:400;color:var(--muted);background:none;border:0;cursor:pointer;text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--faint)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="note">
  <p>Click the raised line. Then press and hold on the red bar to clear it.</p>
  <button id="bWin" aria-pressed="true">Window</button><button id="bPair" aria-pressed="false">Pairing</button>
</div>
<div class="stage">
  <section class="win" id="win" style="--open:minmax(44px,1fr) auto minmax(44px,1fr) minmax(44px,1fr)">
    <header class="head">
      <div><div class="mark">Marshal</div><h1 class="say" id="say"></h1></div>
      <div class="tools"><button class="tool" id="back" hidden>All agents</button><button class="tool">Menu</button><button class="tool">Fold away</button><button class="btn prim" id="cont" hidden>Continue</button></div>
    </header>
    <div class="rows" id="rows"></div>
  </section>
  <div class="scan"><div><div class="vf"><u></u><u></u><u></u><u></u><s></s></div>
    <div class="tip">Look at the code in your terminal <button>Type it instead</button></div>
    <div class="found"><div><h3>Pair with the PC at 192.168.1.197?</h3><p>Check that your terminal shows the same address.</p></div><div class="acts"><button class="btn">Cancel</button><button class="btn prim">Pair</button></div></div></div></div>
  <div class="rail"><i></i><i class="s"><b></b><b></b><b></b></i><i></i><i class="g"></i></div>
</div>

<script>
const agents=[
 {t:'Add the cart badge',v:'Claude Code',c:'#E8875B',steps:['Find the components','Read Cart.tsx','Build the badge','Add the styles','Run the tests'],at:2,state:'busy'},
 {t:'Fix the checkout totals',v:'Codex',c:'#8F7CF7',steps:['Read checkout.tsx','Find the total error','Clear the old build','Fix the rounding','Run the tests'],at:2,state:'needs'},
 {t:'Product search with price filter',v:'Gemini CLI',c:'#5C9DF5',steps:['Read the product page','Build the search bar','Add the price filter','Run the tests'],at:0,state:'busy'},
 {t:'Move the old pages',v:'Muse',c:'#55E0A2',steps:['Look through the old pages','Check the structure','Rebuild About','Run the tests'],at:3,state:'landed'}];
const $=id=>document.getElementById(id), win=$('win'), rows=$('rows'), say=$('say'), back=$('back');
let resolved=false,p=0,raf=0,t0=0;
const pct=(a,i)=>(1.5+97*i/(a.steps.length-1))+'%';

function draw(){
  rows.innerHTML=agents.map((a,k)=>{
    const n=a.steps.length-1, halted=document.body.classList.contains('halt')&&a.state!=='landed';
    const ticks=a.steps.map((s,i)=>`<i class="tick ${i<=a.at?'done':''}" style="left:${pct(a,i)}"></i>`+(i>=a.at&&i<n?`<i class="seg" style="left:${pct(a,i)};width:${97/n}%;--n:${Math.round(560/n/25)}"></i>`:'')).join('');
    const label=a.state==='landed'?'All '+a.steps.length+' steps done':a.steps[a.at];
    const stat=halted?'Stopped':a.state==='needs'?'Holding':a.state==='landed'?'Landed':(a.at+1)+' of '+a.steps.length;
    return `<article class="row ${halted?'stopped':a.state}" data-k="${k}" style="--c:${a.c};--at:${pct(a,a.at)}">
      <div class="id"><h2>${a.t}</h2><p><i></i>${a.v}</p></div>
      <div class="track"><div class="paint"><b></b></div>${ticks}<span class="now ${a.at/n>.6||((a.state==='needs'||halted)&&a.at/n>.3)?'r':(a.state==='needs'||halted)?'after':''}">${label}</span><i class="craft"></i>
        ${a.state==='needs'||halted?'<div class="sbar">'+'<i></i>'.repeat(7)+'</div>':''}</div>
      <div class="stat">${stat}</div>
      ${a.state==='needs'?req(a):a.state==='busy'?work(a):''}</article>`}).join('');
  const n=agents.find(a=>a.state==='needs');
  $('cont').hidden=!document.body.classList.contains('halt');
  if(document.body.classList.contains('halt')) say.textContent='Everything is stopped.'; else
  if(!win.classList.contains('open')) say.innerHTML = n ? `${n.v} is holding <em>for you.</em>` : `All four <em>are moving.</em>`;
  rows.querySelectorAll('.row').forEach(r=>r.onclick=()=>{ const a=agents[r.dataset.k]; if(win.classList.contains('open')){ if(!r.classList.contains('sel')) close(); } else if(a.state!=='landed'&&!document.body.classList.contains('halt')) open(r,a); });
  wire();
}
function req(a){ return `<div class="req">
  <div class="cmd">rm -rf build/ ../shared/cache</div>
  <ol class="plan">${a.steps.map((s,i)=>`<li class="${i<a.at?'done':i==a.at?'held':''}">${s}</li>`).join('')}</ol>
  <div class="facts"><div><b>214</b>files</div><div><b>3</b>outside this project</div><div class="gone"><b>Gone</b>no way back</div></div>
  <div class="clear"><div class="hold" id="hold"><div class="big" id="big">${'<i></i>'.repeat(21)}</div><p id="ht">Pinch with <b>both hands</b> and hold until the bar is dark</p></div>
    <div class="acts"><button class="btn" id="later">Later</button><button class="btn deny" id="deny">Deny</button></div></div></div>`}
function open(r,a){ win.style.setProperty('--open',agents.map(x=>x===a?'auto':'minmax(44px,1fr)').join(' ')); r.classList.add('sel'); win.classList.add('open'); back.hidden=false; say.textContent = a.state==='needs' ? 'Codex wants to delete a folder, for good.' : a.v+' is on step '+(a.at+1)+' of '+a.steps.length+'.'; }
function work(a){ return `<div class="req">
  <ul class="log"><li><span>read</span><code>components/Cart.tsx</code></li><li><span>read</span><code>styles/cart.css</code></li><li><span>wrote</span><code>components/CartBadge.tsx</code></li><li><span>runs</span><code>npm test -- CartBadge</code></li></ul>
  <ol class="plan">${a.steps.map((s,i)=>`<li class="${i<a.at?'done':i==a.at?'now':''}">${s}</li>`).join('')}</ol>
  <div class="clear"><div class="reply">Tell ${a.v} something</div><div class="acts"><button class="btn">Keyboard</button><button class="btn prim">Send</button></div></div></div>`}
function close(){ win.classList.remove('open'); back.hidden=true; draw(); }
back.onclick=close;

function wire(){ const hz=$('hold'); if(!hz) return; const L=[...$('big').children], N=L.length;
  const paint=()=>{ const k=Math.round(p*Math.ceil(N/2)); L.forEach((el,i)=>el.classList.toggle('out',Math.min(i,N-1-i)<k)); };
  const tick=now=>{ p=Math.min(1,(now-t0)/1500); paint(); p<1 ? raf=requestAnimationFrame(tick) : done(); };
  const done=()=>{ resolved=true; L.forEach(l=>l.classList.remove('out')); $('big').classList.add('ok'); $('ht').innerHTML='<b>Cleared.</b> Codex is moving again';
    setTimeout(()=>{ agents[1].state='busy'; agents[1].steps[2]='Clear the old build'; close(); setTimeout(()=>{agents[1].at=3; draw();},900); },1000); };
  hz.onpointerdown=e=>{ if(resolved) return; e.preventDefault(); cancelAnimationFrame(raf); t0=performance.now()-p*1500; raf=requestAnimationFrame(tick); $('ht').textContent='Keep holding'; };
  const up=()=>{ if(resolved||!p) return; cancelAnimationFrame(raf); const un=()=>{ p=Math.max(0,p-.07); paint(); p>0 ? raf=requestAnimationFrame(un) : $('ht').innerHTML='Pinch with <b>both hands</b> and hold until the bar is dark'; }; raf=requestAnimationFrame(un); };
  hz.onpointerup=hz.onpointerleave=hz.onpointercancel=up;
  $('deny').onclick=e=>{ e.stopPropagation(); resolved=true; agents[1].state='busy'; agents[1].steps[2]='Find another way'; close(); };
  $('later').onclick=e=>{ e.stopPropagation(); close(); };
  if(location.hash==='#hold'){ p=.55; paint(); }
}
function fit(){ const st=document.querySelector('.stage'); win.style.setProperty('--s',Math.min((st.clientWidth-8)/1180,(st.clientHeight-8)/690)); }
addEventListener('resize',fit); addEventListener('load',fit); new ResizeObserver(fit).observe(document.querySelector('.stage'));
const mode=pair=>{ document.body.classList.toggle('pair',pair); $('bPair').ariaPressed=pair; $('bWin').ariaPressed=!pair; };
$('bPair').onclick=()=>mode(true); $('bWin').onclick=()=>mode(false);
const h=location.hash;
if(h==='#halt') document.body.classList.add('halt');
if(h==='#rail') document.body.classList.add('is-rail');
draw(); fit();
if(h==='#open'||h==='#hold'){ open(rows.children[1],agents[1]); wire(); }
if(h==='#work') open(rows.children[0],agents[0]);
if(h==='#pair'||h==='#found') mode(true);
if(h==='#found') document.body.classList.add('is-found');
</script>
</body>
</html>
